<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Liên hệ với Dootea - Thương hiệu trà Việt">

    <title>Liên hệ | Dootea</title>

    <!-- CSS CHUNG -->
    <link rel="stylesheet" href="css/style.css">

    <!-- CSS RIÊNG TRANG LIÊN HỆ -->
    <link rel="stylesheet" href="css/contact.css">

</head>


<body class="contact-page">

    <!-- =========================
         HEADER
    ========================== -->

    <div id="header"></div>


    <!-- =========================
         PHẦN LIÊN HỆ
    ========================== -->

    <main>

        <section class="dootea-contact">

            <div class="contact-container">


                <!-- CỘT 1 - GIỚI THIỆU -->

                <div class="contact-brand">

                    <img src="images/logo.png"
                         alt="Dootea Logo"
                         class="brand-logo">

                    <p>
                        Thưởng thức hương vị trà tự nhiên,
                        tận hưởng những khoảnh khắc tuyệt vời
                        cùng Dootea.
                    </p>

                </div>


                <!-- CỘT 2 - THÔNG TIN -->

                <div class="contact-info">

                    <h3>
                        THÔNG TIN LIÊN HỆ
                    </h3>


                    <!-- Facebook -->

                    <div class="contact-item">

                        <span class="contact-icon">
                            ⓕ
                        </span>

                        <div class="contact-content">

                            <strong>
                                Facebook
                            </strong>

                            <a href="https://www.facebook.com/dootea"
                               target="_blank">

                                facebook.com/dootea

                            </a>

                        </div>

                    </div>


                    <!-- Điện thoại -->

                    <div class="contact-item">

                        <span class="contact-icon">
                            📞
                        </span>

                        <div class="contact-content">

                            <strong>
                                Điện thoại
                            </strong>

                            <a href="tel:0987654321">

                                0987 654 321

                            </a>

                        </div>

                    </div>


                    <!-- Email -->

                    <div class="contact-item">

                        <span class="contact-icon">
                            ✉️
                        </span>

                        <div class="contact-content">

                            <strong>
                                Email
                            </strong>

                            <a href="mailto:dootea@gmail.com">

                                dootea@gmail.com

                            </a>

                        </div>

                    </div>


                    <!-- Địa chỉ -->

                    <div class="contact-item">

                        <span class="contact-icon">
                            📍
                        </span>

                        <div class="contact-content">

                            <strong>
                                Địa chỉ
                            </strong>

                            <p>
                                79 Hồ Tùng Mậu,
                                Hà Nội, Việt Nam
                            </p>

                        </div>

                    </div>

                </div>


                <!-- CỘT 3 - BẢN ĐỒ -->

                <div class="contact-image">

                    <img src="images/bando.jpg"
                         alt="Bản đồ vị trí Dootea">

                </div>

            </div>

        </section>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <div id="footer"></div>


    <!-- JAVASCRIPT -->

    <script src="js/main.js"></script>

</body>

</html>
